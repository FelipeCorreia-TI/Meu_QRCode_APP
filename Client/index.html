<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="icon/icon_site.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Meu QRCode</title>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="barra_superior">
          <!--Cria o elemento da barra superior-->
          <p id="cabecalho">MEU QR CODE SESI</p>
          <!--Título do app-->
        </div>
      </header>

      <main class="content-main">
        <section class="campo_imagem">
          <!--Aonde a imagem ficará-->
          <img
            id="foto_visualizar"
            src="https://images.seeklogo.com/logo-png/22/1/sesi-logo-png_seeklogo-223485.png"
          />
        </section>

        <section class="campo_botao">
          <!-- Adicionado o ID correto na label de upload -->
          <label class="botao" for="upload_imagem" id="label_upload"
            >Adicionar QR Code</label
          >
          <input
            id="upload_imagem"
            type="file"
            accept="image/*"
            style="display: none"
          />

          <!-- Corrigido: O ID remove_imagem ficou apenas na label que o usuário clica -->
          <label class="botao" for="input_remove" id="remove_imagem"
            >Remover QR Code</label
          >
          <input id="input_remove" type="button" style="display: none" />
        </section>
      </main>
    </div>
    <script src="scripts/script.js"></script>
    <script src="scripts/database.js"></script>
    <link rel="manifest" href="../manifest.json">
    <script>
      // Verifica se o navegador suporta Service Workers
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('Service Worker registrado com sucesso!', reg.scope))
            .catch((err) => console.error('Falha ao registrar o Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
