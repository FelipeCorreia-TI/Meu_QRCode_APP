<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="icon/icon_site.jfif" type="image/x-icon" />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Meu QRCode</title>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="barra_superior">
          <!--Cria o elemento da barra superior-->
          <p id="cabecalho">MEU QR CODE SESI</p>
          <!--Título do app-->
        </div>
      </header>

      <main class="content-main">
        <section class="campo_imagem">
          <!--Aonde a imagem ficará-->
          <img id="foto_visualizar" src="https://images.seeklogo.com/logo-png/22/1/sesi-logo-png_seeklogo-223485.png"/>
        </section>

        <section class="campo_botao">
          <label class="botao" for="upload_imagem" id="botao_upload">Adicionar QR Code</label>
          <input
            id="upload_imagem"
            type="file"
            accept="image/*"
            style="display: none"
          />
          

          <label class="botao" for="remove_imagem" id="remove_imagem">Remover QR Code</label>
          <input
            id="remove_imagem"
            type="button"
            name="remove_imagem"
            value="Remover QR Code"
            style="display:none"
          />
        </section>
      </main>
    </div>
    <script src="scripts/script.js"></script>
    <script src="scripts/database.js"></script>
  </body>
</html>
